name: 每日監測學校招標

on:
  schedule:
    - cron: '30 0 * * *'   # 每日 08:30 HKT 開始，約 9:00 前完成
    - cron: '0 18 * * 6'   # 每週日 02:00 HKT 全面重新掃描所有學校
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = 只檢查監測中網站；full = 全面重新掃描'
        default: daily
        type: choice
        options: [daily, full]

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - run: pip install -r crawler/requirements.txt && python -m playwright install --with-deps chromium
      - name: Run monitor
        env:
          TZ: Asia/Hong_Kong
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 18 * * 6" ]; then MODE=full; else MODE=daily; fi
          fi
          python crawler/monitor.py "$MODE"
      - name: Commit data
        run: |
          git config user.name "school-tender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data crawler/schools_edb.json
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') 自動更新"
          git pull --rebase && git push
      - name: Check run result
        run: |
          python - <<'EOF'
          import json, sys
          run = json.load(open('public/data/meta.json'))['runs'][0]
          print('sites ok:', run.get('ok'), '/', run.get('sites_checked'))
          if run.get('sites_checked') and not run.get('ok'):
              print('::error::監測系統出錯：所有網站都讀取失敗')
              sys.exit(1)
          b = run.get('backup') or {}
          print('PDF backup:', b)
          if b.get('sys'):
              print('::error::PDF 備份系統出錯：' + b.get('sys_msg', ''))
              sys.exit(1)
          EOF
